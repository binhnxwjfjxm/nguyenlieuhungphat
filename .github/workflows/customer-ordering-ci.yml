name: Customer Ordering CI

on:
  push:
    branches:
      - "agent/customer-ordering-*"
    paths:
      - "customer-ordering/**"
      - ".github/workflows/customer-ordering-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "customer-ordering/**"
      - ".github/workflows/customer-ordering-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ordering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-ordering

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-ordering/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run UI-0 tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
