name: Customer Ordering CI

on:
  push:
    branches:
      - main
      - "agent/customer-ordering-*"
    paths:
      - "customer-ordering/**"
      - "scripts/vercel/**"
      - ".github/workflows/customer-ordering-ci.yml"
      - ".github/workflows/vercel-customer-ordering-project-bootstrap-manual.yml"
      - ".github/workflows/vercel-customer-ordering-production-manual.yml"
      - ".github/workflows/vercel-website-production-manual.yml"
  pull_request:
    paths:
      - "customer-ordering/**"
      - "scripts/vercel/**"
      - ".github/workflows/customer-ordering-ci.yml"
      - ".github/workflows/vercel-customer-ordering-project-bootstrap-manual.yml"
      - ".github/workflows/vercel-customer-ordering-production-manual.yml"
      - ".github/workflows/vercel-website-production-manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ordering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-customer-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit without marketplace action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${CHECKOUT_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${CHECKOUT_SHA}"

      - name: Select preinstalled Node.js 22
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(find "${RUNNER_TOOL_CACHE}/node" -path '*/x64/bin/node' -type f | grep '/22\.' | sort -V | tail -n 1)"
          test -n "${NODE_BIN}"
          NODE_DIR="$(dirname "${NODE_BIN}")"
          echo "${NODE_DIR}" >> "${GITHUB_PATH}"
          "${NODE_BIN}" --version

      - name: Install dependencies
        working-directory: customer-ordering
        run: npm ci

      - name: Test, lint, typecheck and build
        working-directory: customer-ordering
        run: npm run verify
