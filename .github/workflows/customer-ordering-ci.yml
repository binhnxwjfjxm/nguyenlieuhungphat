name: Customer Ordering CI

on:
  push:
    branches:
      - main
    paths:
      - "customer-ordering/**"
      - "BANG_GIA_CHUAN_HOA_CAP_NHAT_DS_SP_23.07.26.xlsx"
      - "BANG_GIA_KENH_QUAN_THEM_NHOM_CHI_TIET.xlsx"
      - "scripts/vercel/**"
      - ".github/workflows/customer-ordering-ci.yml"
      - ".github/workflows/vercel-customer-ordering-project-bootstrap-manual.yml"
      - ".github/workflows/vercel-customer-ordering-production-manual.yml"
      - ".github/workflows/vercel-website-production-manual.yml"
  pull_request:
    paths:
      - "customer-ordering/**"
      - "BANG_GIA_CHUAN_HOA_CAP_NHAT_DS_SP_23.07.26.xlsx"
      - "BANG_GIA_KENH_QUAN_THEM_NHOM_CHI_TIET.xlsx"
      - "scripts/vercel/**"
      - ".github/workflows/customer-ordering-ci.yml"
      - ".github/workflows/vercel-customer-ordering-project-bootstrap-manual.yml"
      - ".github/workflows/vercel-customer-ordering-production-manual.yml"
      - ".github/workflows/vercel-website-production-manual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ordering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-customer-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: customer-ordering
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-ordering/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test, lint, typecheck and build
        run: npm run verify
