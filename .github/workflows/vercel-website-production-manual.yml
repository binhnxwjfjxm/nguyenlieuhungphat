name: Deploy Website production

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deploy-website-production' &&
      github.event.issue.number == 4 &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture exact main SHA
        id: exact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require green CI at exact SHA
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
          WORKFLOW_FILE: frontend-ci.yml
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: process.env.WORKFLOW_FILE,
              head_sha: process.env.EXACT_SHA,
              event: "push",
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              (run) => run.status === "completed" && run.conclusion === "success",
            );
            if (!passed) core.setFailed(`No green ${process.env.WORKFLOW_FILE} run for ${process.env.EXACT_SHA}`);
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.0.0
      - name: Capture exact deployment serving Website production
        id: previous
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
          VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
          WEBSITE_PRODUCTION_HOST: www.nguyenlieuhungphat.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const aliasUrl = new URL(`https://api.vercel.com/v4/aliases/${encodeURIComponent(process.env.WEBSITE_PRODUCTION_HOST)}`);
          aliasUrl.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          aliasUrl.searchParams.set("projectId", process.env.VERCEL_WEBSITE_PROJECT_ID);
          const response = await fetch(aliasUrl, {
            headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          const body = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`website_production_alias_lookup_failed_${response.status}`);
          const deploymentId = body?.deploymentId || body?.deployment?.id || body?.deployment?.uid || "";
          if (body?.projectId !== process.env.VERCEL_WEBSITE_PROJECT_ID) throw new Error("website_production_alias_project_mismatch");
          if (!/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error("website_production_alias_deployment_missing");
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${deploymentId}\n`);
          console.log(`Production alias owner captured: ${deploymentId.slice(0, 12)}...`);
          NODE
      - name: Create staged Website production deployment
        id: staged
        env:
          EXPECTED_MAIN_SHA: ${{ steps.exact.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRODUCTION_BRANCH: main
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
          VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
          VERCEL_CUSTOMER_ORDERING_PROJECT_ID: prj_btLk3p4FhmShgKFdRBMq6ZFOagKe
          WEBSITE_PRODUCTION_ORIGIN: https://www.nguyenlieuhungphat.com
        run: node scripts/vercel/deploy-website-production.mjs
      - name: Resolve and verify staged Website deployment
        id: deployment
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.exact.outputs.sha }}
          STAGED_DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
          VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
          WEBSITE_PRODUCTION_HOST: www.nguyenlieuhungphat.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const stagedUrl = new URL(process.env.STAGED_DEPLOYMENT_URL);
          const deploymentUrl = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(stagedUrl.hostname)}`);
          deploymentUrl.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          deploymentUrl.searchParams.set("withGitRepoInfo", "true");
          const response = await fetch(deploymentUrl, {
            headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          const body = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`website_staged_deployment_lookup_failed_${response.status}`);

          const deploymentId = body?.id || body?.uid || "";
          const readyState = body?.readyState || body?.state || "";
          const sourceSha = body?.meta?.githubCommitSha || body?.gitSource?.sha || "";
          if (!/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error("website_staged_deployment_id_missing");
          if (readyState !== "READY") throw new Error(`website_staged_deployment_not_ready_${readyState || "unknown"}`);
          if (body?.target !== "production") throw new Error("website_staged_deployment_target_mismatch");
          if (body?.projectId && body.projectId !== process.env.VERCEL_WEBSITE_PROJECT_ID) throw new Error("website_staged_deployment_project_mismatch");
          if (body?.project?.id && body.project.id !== process.env.VERCEL_WEBSITE_PROJECT_ID) throw new Error("website_staged_deployment_project_mismatch");
          if (sourceSha !== process.env.EXPECTED_MAIN_SHA) throw new Error("website_staged_deployment_sha_mismatch");

          const aliasesUrl = new URL(`https://api.vercel.com/v2/deployments/${encodeURIComponent(deploymentId)}/aliases`);
          aliasesUrl.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          const aliasesResponse = await fetch(aliasesUrl, {
            headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
          });
          const aliasesBody = await aliasesResponse.json().catch(() => null);
          if (!aliasesResponse.ok) throw new Error(`website_staged_alias_lookup_failed_${aliasesResponse.status}`);
          const aliases = Array.isArray(aliasesBody?.aliases) ? aliasesBody.aliases : [];
          if (aliases.some((item) => item?.alias === process.env.WEBSITE_PRODUCTION_HOST)) {
            throw new Error("website_staged_deployment_received_production_alias_before_smoke");
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `id=${deploymentId}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${process.env.STAGED_DEPLOYMENT_URL}\n`);
          console.log(`Staged deployment verified: ${deploymentId.slice(0, 12)}... sha=${sourceSha.slice(0, 12)}`);
          NODE
      - name: Smoke Gemini and metering on exact staged deployment
        shell: bash
        env:
          STAGED_DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          smoke_file="$(mktemp)"
          trap 'rm -f "$smoke_file"' EXIT
          set +e
          ai_status="$(vercel curl /api/dialogflow/chat \
            --deployment "$STAGED_DEPLOYMENT_URL" \
            --token "$VERCEL_TOKEN" \
            --yes \
            -- \
            --silent --show-error --fail-with-body --connect-timeout 8 --max-time 60 \
            --output "$smoke_file" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json; charset=utf-8' \
            --data "{\"message\":\"Xin chào, vui lòng giới thiệu ngắn gọn Hưng Phát có thể hỗ trợ khách hàng điều gì.\",\"sessionId\":\"production-smoke-${GITHUB_RUN_ID}\",\"source\":\"production-smoke\",\"transcript\":\"\",\"honeypot\":\"\"}")"
          request_status=$?
          set -e
          if [ "$request_status" -ne 0 ] || [ "$ai_status" != "200" ] || ! jq -e '.ok == true and (.replyText | type == "string" and length > 0) and .usageRecorded == true' "$smoke_file" >/dev/null 2>&1; then
            smoke_code="$(jq -r '.code // "unknown"' "$smoke_file" 2>/dev/null || echo unknown)"
            echo "Website staged AI/metering smoke failed: command=${request_status}, HTTP=${ai_status:-none}, code=${smoke_code}." >&2
            exit 1
          fi
          echo "WEBSITE_AI_STAGED_SMOKE=success"
          echo "WEBSITE_AI_METERING_SMOKE=success"
      - name: Promote exact deployment and verify Website production identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
          VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
          WEBSITE_PRODUCTION_HOST: www.nguyenlieuhungphat.com
          WEBSITE_PRODUCTION_ORIGIN: https://www.nguyenlieuhungphat.com
          PREVIOUS_PRODUCTION_DEPLOYMENT_ID: ${{ steps.previous.outputs.id }}
          NEW_DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          EXPECTED_MAIN_SHA: ${{ steps.exact.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const headers = {
            authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
            "content-type": "application/json",
          };
          const teamId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_WEBSITE_PROJECT_ID;
          const host = process.env.WEBSITE_PRODUCTION_HOST;
          const origin = process.env.WEBSITE_PRODUCTION_ORIGIN.replace(/\/+$/, "");
          const previousDeploymentId = process.env.PREVIOUS_PRODUCTION_DEPLOYMENT_ID;
          const newDeploymentId = process.env.NEW_DEPLOYMENT_ID;

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function aliasDeploymentId() {
            const url = new URL(`https://api.vercel.com/v4/aliases/${encodeURIComponent(host)}`);
            url.searchParams.set("teamId", teamId);
            url.searchParams.set("projectId", projectId);
            const response = await fetch(url, { headers });
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`website_alias_lookup_failed_${response.status}`);
            return body?.deploymentId || body?.deployment?.id || body?.deployment?.uid || "";
          }

          async function waitForAlias(expectedDeploymentId, attempts = 30) {
            let lastSeen = "";
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              lastSeen = await aliasDeploymentId();
              if (lastSeen === expectedDeploymentId) return;
              if (attempt < attempts) await sleep(2000);
            }
            throw new Error(`website_alias_identity_timeout_expected_${expectedDeploymentId}_seen_${lastSeen || "none"}`);
          }

          async function assertProductionHealth() {
            for (const path of ["/", "/san-pham"]) {
              const response = await fetch(`${origin}${path}`, {
                redirect: "follow",
                signal: AbortSignal.timeout(15000),
              });
              if (response.status < 200 || response.status >= 400) {
                throw new Error(`website_production_health_failed_${path}_${response.status}`);
              }
            }
          }

          async function rollbackToPrevious(cause) {
            console.error(`Website promotion verification failed: ${cause}`);
            console.error(`Restoring exact previous production deployment ${previousDeploymentId.slice(0, 12)}...`);
            const rollbackUrl = new URL(`https://api.vercel.com/v1/projects/${encodeURIComponent(projectId)}/rollback/${encodeURIComponent(previousDeploymentId)}`);
            rollbackUrl.searchParams.set("teamId", teamId);
            const rollbackResponse = await fetch(rollbackUrl, { method: "POST", headers });
            if (!rollbackResponse.ok) throw new Error(`website_rollback_request_failed_${rollbackResponse.status}`);
            await waitForAlias(previousDeploymentId);
            await assertProductionHealth();
            console.error("Website rollback identity verified.");
          }

          try {
            const promoteUrl = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/promote/${encodeURIComponent(newDeploymentId)}`);
            promoteUrl.searchParams.set("teamId", teamId);
            const promoteResponse = await fetch(promoteUrl, { method: "POST", headers });
            if (!promoteResponse.ok) throw new Error(`website_promote_request_failed_${promoteResponse.status}`);

            await waitForAlias(newDeploymentId);
            await assertProductionHealth();
            console.log("WEBSITE_PRODUCTION_ALIAS_VERIFIED=success");
            console.log("WEBSITE_AI_PRODUCTION_SMOKE=success");
            console.log(`DEPLOYED_SHA=${process.env.EXPECTED_MAIN_SHA}`);
          } catch (error) {
            const cause = error instanceof Error ? error.message : String(error);
            try {
              await rollbackToPrevious(cause);
            } catch (rollbackError) {
              console.error(rollbackError instanceof Error ? rollbackError.message : String(rollbackError));
              process.exit(2);
            }
            process.exit(1);
          }
          NODE
