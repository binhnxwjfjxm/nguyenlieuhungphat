name: Deploy Customer Ordering production

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  deploy:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deploy-customer-ordering-production' &&
      github.event.issue.number == fromJSON(vars.VERCEL_DEPLOY_CONTROL_ISSUE_NUMBER || '0') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: customer-ordering-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture exact main SHA
        id: exact
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require green CI at exact SHA
        uses: actions/github-script@v7
        env:
          EXACT_SHA: ${{ steps.exact.outputs.sha }}
          WORKFLOW_FILE: customer-ordering-ci.yml
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: process.env.WORKFLOW_FILE,
              head_sha: process.env.EXACT_SHA,
              event: "push",
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              (run) => run.status === "completed" && run.conclusion === "success",
            );
            if (!passed) core.setFailed(`No green ${process.env.WORKFLOW_FILE} run for ${process.env.EXACT_SHA}`);
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.0.0
      - name: Deploy Customer Ordering
        env:
          EXPECTED_MAIN_SHA: ${{ steps.exact.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRODUCTION_BRANCH: main
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
          VERCEL_WEBSITE_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
          VERCEL_CUSTOMER_ORDERING_PROJECT_ID: prj_btLk3p4FhmShgKFdRBMq6ZFOagKe
          CUSTOMER_ORDERING_PRODUCTION_ORIGIN: https://sales.nguyenlieuhungphat.com
        run: node scripts/vercel/deploy-customer-ordering-production.mjs
