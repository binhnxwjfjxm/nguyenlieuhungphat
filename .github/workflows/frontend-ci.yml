name: Website frontend CI

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test, lint and build
        run: npm run verify
