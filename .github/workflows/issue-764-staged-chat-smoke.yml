name: Issue 764 staged chat smoke

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-764-staged-chat-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'agent/issue-764-staged-chat-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_hBA8rX68UHC8ogvREkOyQlJ2
      VERCEL_PROJECT_ID: prj_rXqH83GFDHuEGUcQrrv82JBPWnjU
      WEBSITE_PRODUCTION_HOST: www.nguyenlieuhungphat.com
      EXPECTED_BASE_SHA: f073c30f5c4e97258f513edb2811e282c73ae401
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact main base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$EXPECTED_BASE_SHA"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.0.0

      - name: Capture current custom production deployment
        id: production_before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const url = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(process.env.WEBSITE_PRODUCTION_HOST)}`);
          url.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          const body = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`production_lookup_failed_${response.status}`);
          const id = body?.id || body?.uid || '';
          if (!/^dpl_[A-Za-z0-9]+$/.test(id)) throw new Error('production_id_missing');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
          console.log('Captured current custom production deployment.');
          NODE

      - name: Create staged deployment with production runtime environment
        id: staged
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.vercel/project.json', JSON.stringify({
            orgId: process.env.VERCEL_ORG_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          }), { mode: 0o600 });
          NODE
          trap 'rm -rf .vercel' EXIT
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" >/dev/null
          deploy_output="$(vercel deploy --archive=tgz --prod --skip-domain --yes --token "$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deploy_output" | tr ' ' '\n' | grep '^https://' | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Staged deployment created; custom production hostname not promoted."

      - name: Verify staged identity and custom production boundary
        id: staged_verify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_DEPLOYMENT_URL: ${{ steps.staged.outputs.url }}
          PRODUCTION_BEFORE_ID: ${{ steps.production_before.outputs.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const headers = { authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const staged = new URL(process.env.STAGED_DEPLOYMENT_URL);
          const deploymentUrl = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(staged.hostname)}`);
          deploymentUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(deploymentUrl, { headers });
          const body = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`staged_lookup_failed_${response.status}`);
          const deploymentId = body?.id || body?.uid || '';
          if (!/^dpl_[A-Za-z0-9]+$/.test(deploymentId)) throw new Error('staged_id_missing');
          if ((body?.readyState || body?.state) !== 'READY') throw new Error('staged_not_ready');
          if (body?.target !== 'production') throw new Error('staged_runtime_environment_mismatch');
          const projectId = body?.projectId || body?.project?.id || '';
          if (projectId && projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('staged_project_mismatch');

          const aliasesUrl = new URL(`https://api.vercel.com/v2/deployments/${encodeURIComponent(deploymentId)}/aliases`);
          aliasesUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const aliasesResponse = await fetch(aliasesUrl, { headers });
          const aliasesBody = await aliasesResponse.json().catch(() => null);
          if (!aliasesResponse.ok) throw new Error(`staged_alias_lookup_failed_${aliasesResponse.status}`);
          const aliases = Array.isArray(aliasesBody?.aliases) ? aliasesBody.aliases : [];
          if (aliases.some((item) => item?.alias === process.env.WEBSITE_PRODUCTION_HOST)) {
            throw new Error('custom_production_hostname_attached_to_staged');
          }

          const productionUrl = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(process.env.WEBSITE_PRODUCTION_HOST)}`);
          productionUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const productionResponse = await fetch(productionUrl, { headers });
          const productionBody = await productionResponse.json().catch(() => null);
          if (!productionResponse.ok) throw new Error(`production_recheck_failed_${productionResponse.status}`);
          const productionId = productionBody?.id || productionBody?.uid || '';
          if (productionId !== process.env.PRODUCTION_BEFORE_ID) throw new Error('custom_production_hostname_changed');

          appendFileSync(process.env.GITHUB_OUTPUT, `id=${deploymentId}\n`);
          console.log('Staged identity and custom production hostname boundary verified.');
          NODE

      - name: Smoke Dialogflow reply and Company metering
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_DEPLOYMENT_URL: ${{ steps.staged.outputs.url }}
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          payload="$(jq -nc --arg sessionId "issue764-${GITHUB_RUN_ID}" '{message:"Xin chào",sessionId:$sessionId,source:"production-smoke",pathname:"/"}')"
          set +e
          status="$(vercel curl /api/dialogflow/chat \
            --deployment "$STAGED_DEPLOYMENT_URL" \
            --yes \
            -- \
            --silent --show-error --max-time 60 \
            --request POST \
            --header 'content-type: application/json' \
            --data "$payload" \
            --output "$result_file" --write-out '%{http_code}')"
          command_status=$?
          set -e
          jq '{ok, code, sessionId, usageRecorded, replyText}' "$result_file"
          if [ "$command_status" -ne 0 ]; then
            echo "Staged chat request command failed: $command_status" >&2
            exit 1
          fi
          test "$status" = "200"
          jq -e '.ok == true and .usageRecorded == true and (.replyText | type == "string" and length > 0)' "$result_file" >/dev/null
          echo "Staged Dialogflow reply and Company metering passed."

      - name: Re-verify custom production hostname unchanged
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_BEFORE_ID: ${{ steps.production_before.outputs.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(process.env.WEBSITE_PRODUCTION_HOST)}`);
          url.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          const body = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`production_final_lookup_failed_${response.status}`);
          const id = body?.id || body?.uid || '';
          if (id !== process.env.PRODUCTION_BEFORE_ID) throw new Error('custom_production_hostname_changed_after_smoke');
          console.log('Custom production hostname remains unchanged.');
          NODE
